name: RallyCounter
options:
  bundleIdPrefix: app.rallycounter
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  RallyCounter:
    type: application
    platform: iOS
    sources: [RallyCounter]
    info:
      path: RallyCounter/Info.plist
      properties:
        CFBundleDisplayName: Rally Counter
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Rally Counter listens for the sound of the ball hitting the racket to count your hits.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rallycounter.RallyCounter
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  RallyCounter:
    build:
      targets:
        RallyCounter: all
