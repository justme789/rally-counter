name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project RallyCounter.xcodeproj \
            -scheme RallyCounter \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          cd build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -R RallyCounter.app Payload/
          zip -qry "$GITHUB_WORKSPACE/RallyCounter.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RallyCounter-ipa
          path: RallyCounter.ipa
